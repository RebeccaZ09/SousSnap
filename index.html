<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SousSnap - 智能厨房助手</title>
    <style>
        :root {
            --bg-color: #f7f7f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(230, 230, 235, 0.8);
            --primary: #FF6B4A;
            --primary-hover: #E05536;
            --secondary: #2C3E50;
            --text-main: #1C1C1E;
            --text-sub: #8E8E93;
            --accent-green: #34C759;
            --accent-orange: #FF9500;
            --danger: #FF3B30;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121212;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* App Container (Mobile Shell) */
        .app-container {
            width: 100%;
            max-width: 440px;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            overflow-x: hidden;
            padding-bottom: 84px; /* Space for bottom tab bar */
        }

        /* Header */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(247, 247, 249, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .app-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .icon-btn:active {
            background: rgba(0, 0, 0, 0.05);
        }

        /* Main Content Area */
        .content {
            padding: 16px 20px;
            flex: 1;
        }

        .hidden {
            display: none !important;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:active {
            background-color: var(--primary-hover);
            transform: scale(0.98);
        }

        .btn-secondary {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.05);
            color: var(--text-main);
            border: none;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary:active {
            background-color: rgba(0, 0, 0, 0.1);
        }

        /* Segmented Control */
        .segmented-control {
            display: flex;
            background: rgba(0, 0, 0, 0.05);
            padding: 3px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
        }

        .segment-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px;
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-sub);
        }

        .segment-btn.active {
            background: white;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            font-weight: 600;
        }

        /* Upload Area */
        .upload-box {
            border: 2px dashed rgba(0, 0, 0, 0.15);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            position: relative;
            background: rgba(255, 255, 255, 0.5);
            transition: border-color 0.2s;
        }

        .upload-box:hover {
            border-color: var(--primary);
        }

        .preview-img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }

        /* Pantry List */
        .pantry-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: white;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            font-size: 13px;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .pantry-tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .tag-fresh { background: rgba(52, 199, 89, 0.15); color: var(--accent-green); }
        .tag-warn { background: rgba(255, 149, 0, 0.15); color: var(--accent-orange); }

        /* Recipe Card Layout */
        .recipe-card {
            background: white;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--card-border);
        }

        .recipe-hero {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: #eee;
        }

        .recipe-body {
            padding: 14px;
        }

        .recipe-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .recipe-title {
            font-size: 16px;
            font-weight: 700;
        }

        .fav-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        .recipe-details {
            margin-top: 10px;
            font-size: 12px;
            color: #444;
            line-height: 1.5;
            white-space: pre-wrap;
            background: var(--bg-color);
            padding: 10px;
            border-radius: var(--radius-sm);
        }

        /* Chips Component */
        .chip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .chip {
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.05);
            font-size: 12px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .chip.active {
            background: var(--primary);
            color: white;
            font-weight: 500;
        }

        /* Inputs */
        .input-field {
            width: 100%;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(0, 0, 0, 0.15);
            font-size: 13px;
            margin-bottom: 10px;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--primary);
        }

        /* Loading Overlay */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 500;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 107, 74, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Bottom Tab Bar */
        .tab-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 440px;
            height: 64px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            z-index: 100;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: var(--text-sub);
            cursor: pointer;
            border: none;
            background: none;
            gap: 2px;
        }

        .tab-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        .tab-icon {
            font-size: 20px;
        }

        /* Config Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-body {
            background: white;
            width: 85%;
            max-width: 340px;
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Loading Overlay -->
    <div id="loadingState" class="loading-overlay hidden">
        <div class="spinner"></div>
        <div id="loadingText">SousSnap AI 思考中...</div>
    </div>

    <!-- App Header -->
    <header class="app-header">
        <div class="app-title">
            <span>🍳</span> SousSnap
        </div>
        <button class="icon-btn" onclick="toggleConfigModal()" title="设置 API Key">⚙️</button>
    </header>

    <!-- Content Sections -->
    <main class="content">
        <!-- TAB 1: HOME / RECIPES -->
        <section id="tab-home">
            <div class="segmented-control">
                <button class="segment-btn active" onclick="setRecipeMode('day')">今日三餐</button>
                <button class="segment-btn" onclick="setRecipeMode('week')">本周晚餐规划</button>
            </div>

            <div class="card">
                <div class="card-title">
                    <span>智能菜谱生成</span>
                    <span style="font-size: 11px; color: var(--text-sub);">依据食材库与偏好</span>
                </div>
                <button class="btn-primary" onclick="generateRecipe()">
                    <span>✨</span> 一键生成专属菜谱
                </button>
                <button class="btn-secondary" style="margin-top: 8px;" onclick="generateNewDiscovery()">
                    💡 推荐小众/创意新菜
                </button>
            </div>

            <!-- Dynamic Feedback & Refinement Input -->
            <div id="refineSection" class="card hidden">
                <div class="card-title">自然语言微调菜谱</div>
                <input type="text" id="feedbackInput" class="input-field" placeholder="如：早餐想换成西式，或者晚餐少油辣...">
                <button class="btn-secondary" onclick="generateRecipeWithFeedback()">提交要求并重构菜谱</button>
            </div>

            <!-- Recipe Output Container -->
            <div id="recipeResults"></div>
        </section>

        <!-- TAB 2: PANTRY & SCANNER -->
        <section id="tab-pantry" class="hidden">
            <div class="card">
                <div class="card-title">小票 / 拍照识别食材</div>
                <label class="upload-box" for="imageFileInput">
                    <div id="uploadText">
                        <div style="font-size: 24px; margin-bottom: 4px;">📷</div>
                        <div style="font-size: 12px; color: var(--text-sub);">点击拍照或上传小票/食材图片</div>
                    </div>
                    <img id="uploadPreview" class="preview-img hidden" alt="预览">
                    <input type="file" id="imageFileInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                </label>
                <button class="btn-primary" style="margin-top: 12px;" onclick="scanImageToPantry()">
                    🔍 识别并存入食材库
                </button>
            </div>

            <div class="card">
                <div class="card-title">
                    <span>我的食材库</span>
                    <button class="btn-secondary" style="width: auto; padding: 4px 8px; font-size: 11px;" onclick="clearAllPantry()">清空</button>
                </div>
                <div style="display: flex; gap: 6px; margin-bottom: 10px;">
                    <input type="text" id="manualIngredient" class="input-field" style="margin-bottom:0;" placeholder="手动添加食材...">
                    <button class="btn-primary" style="width: auto; white-space: nowrap;" onclick="addManualIngredient()">添加</button>
                </div>
                <div id="pantryList"></div>
            </div>
        </section>

        <!-- TAB 3: COOKBOOK / FAVORITES / SHOPPING -->
        <section id="tab-cookbook" class="hidden">
            <div class="card">
                <div class="card-title">❤️ 收藏的菜谱</div>
                <div id="favoriteList"></div>
            </div>

            <div class="card">
                <div class="card-title">🛒 智能补货清单推荐</div>
                <button class="btn-secondary" onclick="generateShoppingList()">生成周度补货清单</button>
                <div id="shoppingListContainer" style="margin-top: 10px;"></div>
            </div>
        </section>

        <!-- TAB 4: PROFILE & PREFERENCES -->
        <section id="tab-profile" class="hidden">
            <div class="card">
                <div class="card-title">口味偏好</div>
                <div class="chip-group" id="tasteChips">
                    <div class="chip" onclick="toggleChip(this, 'taste', '清淡')">🥗 清淡</div>
                    <div class="chip" onclick="toggleChip(this, 'taste', '麻辣')">🌶️ 麻辣</div>
                    <div class="chip" onclick="toggleChip(this, 'taste', '酸甜')">🍍 酸甜</div>
                    <div class="chip" onclick="toggleChip(this, 'taste', '低碳/减脂')">🥑 低碳/减脂</div>
                    <div class="chip" onclick="toggleChip(this, 'taste', '高蛋白')">🥩 高蛋白</div>
                </div>

                <div class="card-title" style="margin-top: 16px;">菜系偏好</div>
                <div class="chip-group" id="cuisineChips">
                    <div class="chip" onclick="toggleChip(this, 'cuisine', '川湘菜')">川湘菜</div>
                    <div class="chip" onclick="toggleChip(this, 'cuisine', '粤菜/江浙菜')">粤菜/清淡</div>
                    <div class="chip" onclick="toggleChip(this, 'cuisine', '日韩料理')">日韩料理</div>
                    <div class="chip" onclick="toggleChip(this, 'cuisine', '意式/西餐')">意式/西餐</div>
                    <div class="chip" onclick="toggleChip(this, 'cuisine', '快捷快手菜')">⏱️ 快手菜</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Navigation Tab Bar -->
    <nav class="tab-bar">
        <button class="tab-item active" onclick="switchTab('home')">
            <span class="tab-icon">📖</span>
            <span>菜谱</span>
        </button>
        <button class="tab-item" onclick="switchTab('pantry')">
            <span class="tab-icon">🧊</span>
            <span>食材库</span>
        </button>
        <button class="tab-item" onclick="switchTab('cookbook')">
            <span class="tab-icon">❤️</span>
            <span>收藏/清单</span>
        </button>
        <button class="tab-item" onclick="switchTab('profile')">
            <span class="tab-icon">👤</span>
            <span>偏好</span>
        </button>
    </nav>
</div>

<!-- API Key Configuration Modal -->
<div id="configModal" class="modal">
    <div class="modal-body">
        <h3 style="font-size: 16px; margin-bottom: 8px;">配置 Gemini API Key</h3>
        <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 12px;">秘钥将仅安全保存在您的浏览器本地 LocalStorage 中。</p>
        <input type="password" id="apiKeyInput" class="input-field" placeholder="AIzaSy...">
        <div style="display: flex; gap: 8px;">
            <button class="btn-secondary" onclick="toggleConfigModal()">取消</button>
            <button class="btn-primary" onclick="saveApiKey()">保存</button>
        </div>
    </div>
</div>

<!-- Complete Script Logic -->
<script>
    let recipeMode = 'day'; 
    let currentImageBase64 = null;
    let pantry = [];
    let favorites = [];
    let profile = { taste: [], cuisine: [] };

    document.addEventListener('DOMContentLoaded', () => {
        loadPantry();
        loadProfile();
        loadFavorites();
        cleanExpiredItems();
        
        // Auto prompt for API Key on first run if missing
        if (!localStorage.getItem('gemini_api_key')) {
            setTimeout(toggleConfigModal, 500);
        }
    });

    // Centralized Helper for Gemini API Calls
    async function callGeminiAPI(payload) {
        const apiKey = localStorage.getItem('gemini_api_key');
        if (!apiKey) {
            toggleConfigModal();
            throw new Error("请先设置 Gemini API Key");
        }
        
        // Dynamic Model Alias Pointer: points to the newest stable Flash model automatically
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash:generateContent`;
        
        const response = await fetch(url, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'x-goog-api-key': apiKey 
            },
            body: JSON.stringify(payload)
        });
        
        const data = await response.json();
        if (data.error) {
            if (data.error.code === 400 || data.error.code === 403) {
                localStorage.removeItem('gemini_api_key');
                toggleConfigModal();
            }
            throw new Error(`[API Error ${data.error.code}]: ${data.error.message}`);
        }
        
        if (!data.candidates || !data.candidates[0]?.content?.parts[0]?.text) {
            throw new Error("模型未返回有效内容");
        }
        
        return data.candidates[0].content.parts[0].text;
    }

    // Helper: Safely extract and parse JSON from Markdown text
    function safeParseJSON(rawText) {
        try {
            const cleanText = rawText.replace(/```json|```/g, '').trim();
            const match = cleanText.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
            return JSON.parse(match ? match[0] : cleanText);
        } catch (e) {
            throw new Error("返回数据解析 JSON 失败: " + e.message);
        }
    }

    // Navigation & Tab Switcher
    function switchTab(tabName) {
        ['home', 'pantry', 'cookbook', 'profile'].forEach(t => {
            document.getElementById(`tab-${t}`).classList.add('hidden');
        });
        document.getElementById(`tab-${tabName}`).classList.remove('hidden');

        document.querySelectorAll('.tab-item').forEach((btn, idx) => {
            btn.classList.toggle('active', ['home', 'pantry', 'cookbook', 'profile'][idx] === tabName);
        });

        if (tabName === 'cookbook') renderFavorites();
    }

    function setRecipeMode(mode) {
        recipeMode = mode;
        document.querySelectorAll('.segment-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', (idx === 0 && mode === 'day') || (idx === 1 && mode === 'week'));
        });
    }

    // Profile & Filter Chips
    function toggleChip(btn, category, value) {
        btn.classList.toggle('active');
        if (btn.classList.contains('active')) {
            if (!profile[category].includes(value)) profile[category].push(value);
        } else {
            profile[category] = profile[category].filter(v => v !== value);
        }
        saveProfile();
    }

    function saveProfile() { localStorage.setItem('soussnap_profile', JSON.stringify(profile)); }
    function loadProfile() {
        profile = JSON.parse(localStorage.getItem('soussnap_profile') || '{"taste":[],"cuisine":[]}');
        document.querySelectorAll('#tasteChips .chip').forEach(btn => {
            const text = btn.innerText.replace(/^[^\s]+\s/, '');
            if (profile.taste.includes(text)) btn.classList.add('active');
        });
        document.querySelectorAll('#cuisineChips .chip').forEach(btn => {
            const text = btn.innerText.replace(/^[^\s]+\s/, '');
            if (profile.cuisine.includes(text)) btn.classList.add('active');
        });
    }

    // Image Upload & Preview Handling
    function handleImageUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            currentImageBase64 = evt.target.result.split(',')[1];
            const img = document.getElementById('uploadPreview');
            img.src = evt.target.result;
            img.classList.remove('hidden');
            document.getElementById('uploadText').classList.add('hidden');
        };
        reader.readAsDataURL(file);
    }

    // Multimodal API Scan: Photo to Pantry Ingredients
    async function scanImageToPantry() {
        if (!currentImageBase64) { alert('请先拍照或选择图片'); return; }
        showLoading(true, "正在分析小票/图片...");
        const prompt = `分析这张照片，提取识别到的食材名称。严格以 JSON 格式输出: {"items": ["食材1", "食材2"]}`;

        try {
            const rawText = await callGeminiAPI({
                contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: currentImageBase64 } }] }]
            });
            const resData = safeParseJSON(rawText);
            const items = resData.items || [];

            items.forEach(name => {
                if (!pantry.some(p => p.name === name)) {
                    pantry.push({ name, timestamp: Date.now(), expireDays: 7 });
                }
            });
            savePantry();
            renderPantry();
            alert(`已成功识别并加入 ${items.length} 种食材！`);
        } catch(e) { 
            alert("识别失败: " + e.message); 
        } finally { 
            showLoading(false); 
        }
    }

    // Recipe Generation
    async function generateRecipe(feedbackText = "") {
        showLoading(true, "SousSnap 正在大厨设计中...");
        const ingredientList = pantry.map(p => p.name).join('、');
        const tastePref = profile.taste.join('、') || "家常口味";
        const cuisinePref = profile.cuisine.join('、') || "传统家常菜";
        const isWeek = recipeMode === 'week';

        let prompt = `你是一个顶级厨师助手。`;
        if (ingredientList) {
            prompt += `用户冰箱现有食材：[${ingredientList}]。请优先消耗这些食材。`;
        } else {
            prompt += `用户目前没有上传小票食材库，请基于常见的常备家常食材推荐菜谱。`;
        }
        prompt += `\n用户口味偏好：[${tastePref}]，菜系偏好：[${cuisinePref}]。`;
        prompt += `\n请规划 ${isWeek ? '【本周7天晚餐】' : '【今天三餐（早餐、午餐、晚餐）】'}。`;

        if (feedbackText) {
            prompt += `\n【用户微调与特别要求】：${feedbackText}。请务必根据此要求调整菜谱！`;
        }

        prompt += `\n严格以 JSON 格式输出：
        {
          "recipes": [
            {
              "time_label": "${isWeek ? '周一' : '早餐'}",
              "dish_name": "菜名",
              "ingredients": ["食材1", "食材2"],
              "steps": "详细烹饪步骤...",
              "image_keyword": "英文美食搜索词"
            }
          ]
        }`;

        try {
            const rawText = await callGeminiAPI({ contents: [{ parts: [{ text: prompt }] }] });
            const result = safeParseJSON(rawText);
            renderRecipes(result.recipes || []);
            document.getElementById('refineSection')?.classList.remove('hidden');
        } catch (e) { 
            console.error(e);
            alert("菜谱生成失败：\n" + e.message); 
        } finally { 
            showLoading(false); 
        }
    }

    // Creative/Uncommon Dish Recommendation
    async function generateNewDiscovery() {
        showLoading(true, "正在寻找灵感...");
        const tastePref = profile.taste.join('、') || "家常口味";
        const prompt = `推荐 1 道小众、不常见但做法简单的创意家常菜。口味偏好：[${tastePref}]。
        严格以 JSON 格式输出:
        {
          "recipes": [{
            "time_label": "创意推荐",
            "dish_name": "菜名",
            "ingredients": ["食材1", "食材2"],
            "steps": "详细步骤...",
            "image_keyword": "english food tag"
          }]
        }`;

        try {
            const rawText = await callGeminiAPI({ contents: [{ parts: [{ text: prompt }] }] });
            const result = safeParseJSON(rawText);
            renderRecipes(result.recipes || []);
        } catch(e) {
            alert("推荐失败: " + e.message);
        } finally {
            showLoading(false);
        }
    }

    function generateRecipeWithFeedback() {
        const val = document.getElementById('feedbackInput').value.trim();
        if (!val) return;
        generateRecipe(val);
    }

    function renderRecipes(recipes) {
        const container = document.getElementById('recipeResults');
        container.innerHTML = '';

        recipes.forEach((r, idx) => {
            const fallbackImg = `https://source.unsplash.com/400x220/?food,${encodeURIComponent(r.image_keyword || 'dish')}`;
            const isFav = favorites.some(f => f.dish_name === r.dish_name);
            const card = document.createElement('div');
            card.className = 'recipe-card';
            card.innerHTML = `
                <img id="img-${idx}" src="${fallbackImg}" class="recipe-hero" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400'">
                <div class="recipe-body">
                    <div class="recipe-header">
                        <div>
                            <span class="pantry-tag tag-fresh">${r.time_label}</span>
                            <div class="recipe-title" style="margin-top:4px;">${r.dish_name}</div>
                        </div>
                        <button class="fav-btn" onclick="toggleFav('${r.dish_name}', '${(r.ingredients||[]).join('、')}')">${isFav ? '❤️' : '🤍'}</button>
                    </div>
                    <div style="font-size:11px; color:var(--text-sub); margin-top:6px;">用料：${(r.ingredients||[]).join('、')}</div>
                    
                    <button class="btn-secondary" style="margin-top:10px; padding:6px; font-size:11px;" onclick="toggleDetails(${idx})">
                        👁️ 查看/折叠步骤
                    </button>
                    
                    <div id="details-${idx}" class="recipe-details hidden">${r.steps}</div>
                    
                    <label class="btn-secondary" style="margin-top:8px; padding:6px; font-size:11px; text-align:center; cursor:pointer;">
                        📸 上传成品照片打卡
                        <input type="file" accept="image/*" class="hidden" onchange="uploadCookPhoto(event, 'img-${idx}')">
                    </label>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function toggleDetails(idx) {
        document.getElementById(`details-${idx}`).classList.toggle('hidden');
    }

    function uploadCookPhoto(e, imgId) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            document.getElementById(imgId).src = evt.target.result;
        };
        reader.readAsDataURL(file);
    }

    // Favorites Logic
    function toggleFav(dishName, ingredientsStr) {
        const index = favorites.findIndex(f => f.dish_name === dishName);
        if (index >= 0) {
            favorites.splice(index, 1);
        } else {
            favorites.push({ dish_name: dishName, ingredients: ingredientsStr });
        }
        localStorage.setItem('soussnap_favs', JSON.stringify(favorites));
        
        // Refresh UI state
        if (!document.getElementById('tab-home').classList.contains('hidden')) {
            document.querySelectorAll('.recipe-card').forEach(card => {
                const title = card.querySelector('.recipe-title')?.innerText;
                if (title === dishName) {
                    const btn = card.querySelector('.fav-btn');
                    if (btn) btn.innerText = index >= 0 ? '🤍' : '❤️';
                }
            });
        }
    }

    function loadFavorites() { favorites = JSON.parse(localStorage.getItem('soussnap_favs') || '[]'); }
    function renderFavorites() {
        const container = document.getElementById('favoriteList');
        if (!favorites.length) {
            container.innerHTML = '<p style="font-size:12px; color:var(--text-sub);">暂无收藏菜谱</p>';
            return;
        }
        container.innerHTML = favorites.map(f => `
            <div class="pantry-item">
                <div>
                    <b>${f.dish_name}</b>
                    <div style="font-size:10px; color:var(--text-sub);">${f.ingredients || ''}</div>
                </div>
                <button onclick="toggleFav('${f.dish_name}'); renderFavorites();" style="background:none; border:none; cursor:pointer;">✕</button>
            </div>
        `).join('');
    }

    // Pantry Storage & Expiration Management
    function renderPantry() {
        const list = document.getElementById('pantryList');
        list.innerHTML = '';
        pantry.forEach((item, idx) => {
            const daysOld = Math.floor((Date.now() - item.timestamp) / (1000 * 60 * 60 * 24));
            const isWarn = daysOld >= 5;
            const div = document.createElement('div');
            div.className = 'pantry-item';
            div.innerHTML = `
                <span><b>${item.name}</b></span>
                <div>
                    <span class="pantry-tag ${isWarn ? 'tag-warn' : 'tag-fresh'}">${isWarn ? '⚠️ 尽快食用' : '新鲜'} (${daysOld}天)</span>
                    <button onclick="removePantry(${idx})" style="background:none; border:none; margin-left:8px; cursor:pointer; color:var(--text-sub);">✕</button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function cleanExpiredItems() {
        pantry = pantry.filter(item => (Date.now() - item.timestamp) < (10 * 24 * 60 * 60 * 1000));
        savePantry();
        renderPantry();
    }

    function addManualIngredient() {
        const input = document.getElementById('manualIngredient');
        const val = input.value.trim();
        if (val) {
            pantry.push({ name: val, timestamp: Date.now(), expireDays: 7 });
            savePantry();
            renderPantry();
            input.value = '';
        }
    }

    function removePantry(idx) { pantry.splice(idx, 1); savePantry(); renderPantry(); }
    function clearAllPantry() { if (confirm('确定清空食材库？')) { pantry = []; savePantry(); renderPantry(); } }
    function savePantry() { localStorage.setItem('soussnap_pantry', JSON.stringify(pantry)); }
    function loadPantry() { pantry = JSON.parse(localStorage.getItem('soussnap_pantry') || '[]'); renderPantry(); }

    // Shopping List Generation
    async function generateShoppingList() {
        const container = document.getElementById('shoppingListContainer');
        container.innerHTML = "⏳ 正在分析补货清单...";

        const prompt = `结合当前偏好以及常见基础厨房食材，列出本周推荐购买的补货清单。严格以 JSON 格式输出: {"shopping": ["鸡蛋", "牛奶", "青菜"]}`;
        try {
            const rawText = await callGeminiAPI({ contents: [{ parts: [{ text: prompt }] }] });
            const listData = safeParseJSON(rawText);
            const list = listData.shopping || [];
            
            container.innerHTML = '';
            list.forEach(item => {
                container.innerHTML += `<div style="font-size:12px; margin-top:6px;"><input type="checkbox"> ${item}</div>`;
            });
        } catch(e) { 
            container.innerHTML = "<span style='color:var(--danger); font-size:12px;'>生成失败: " + e.message + "</span>"; 
        }
    }

    // Config Modal Controls
    function toggleConfigModal() { document.getElementById('configModal').classList.toggle('active'); }
    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        if(key) { 
            localStorage.setItem('gemini_api_key', key); 
            toggleConfigModal(); 
        }
    }
    
    function showLoading(show, text = "SousSnap AI 思考中...") { 
        document.getElementById('loadingText').innerText = text;
        document.getElementById('loadingState').classList.toggle('hidden', !show); 
    }
</script>
</body>
</html>
